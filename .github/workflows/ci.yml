name: CI

on:
  push:
    branches: [main]
    # Ein Tag wie v1.0.0 erzeugt zusaetzlich ein GitHub Release mit der APK.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Version fuer ein Release, z. B. 1.0.0 (leer lassen = nur bauen).
          Der Tag wird dabei vom Runner angelegt.
        required: false
        default: ''

env:
  # Auf die Version festgelegt, mit der die App entwickelt wurde.
  # Zum Aktualisieren hier die neue Stable-Version eintragen.
  FLUTTER_VERSION: 3.47.4

jobs:
  test:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      # Die fertige APK laesst sich unter "Artifacts" herunterladen und direkt
      # auf einem Android-Telefon installieren.
      - uses: actions/upload-artifact@v4
        with:
          name: visitenkarte-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS-Build pruefen
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Ohne Signatur: prueft, dass der iOS-Build durchlaeuft. Eine installierbare
      # .ipa braucht ein Apple-Developer-Zertifikat.
      - run: flutter build ios --release --no-codesign

  release:
    name: Release mit APK veroeffentlichen
    # Bei einem Versions-Tag, oder wenn der Workflow von Hand mit einer Version
    # gestartet wurde. Erst wenn Tests und beide Builds durch sind.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.release_version != ''
    needs: [test, android, ios]
    runs-on: ubuntu-latest
    permissions:
      # Zum Anlegen des Releases - der Standard-Token darf sonst nur lesen.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie, sonst laesst sich kein Tag setzen.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: visitenkarte-android-apk
          path: apk
      - name: APK auf einen festen Namen bringen
        # Der Dateiname muss ueber Versionen hinweg gleich bleiben, sonst
        # funktioniert der Dauerlink auf die jeweils neueste Fassung nicht.
        run: mv apk/app-release.apk visitenkarte.apk
      - name: Tag bestimmen und bei Bedarf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            # Von Hand gestartet: Der Runner legt den Tag selbst an. Sein Token
            # darf das dank contents: write. Eine Identitaet hat er von Haus
            # aus nicht, ohne die verweigert git das Anlegen.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            TAG="v${{ inputs.release_version }}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG existiert bereits."
            else
              git tag -a "$TAG" -m "Visitenkarte ${{ inputs.release_version }}"
              git push origin "$TAG"
            fi
          else
            # Vom Tag-Push ausgeloest.
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Auf dem Telefon installieren

          [**visitenkarte.apk herunterladen**](https://github.com/DrJakeberg/qrcard/releases/latest/download/visitenkarte.apk)

          Diesen Link direkt auf dem Android-Telefon oeffnen, die Datei
          antippen und installieren. Android fragt einmalig nach der Erlaubnis,
          Apps aus dieser Quelle zu installieren.

          Der Link zeigt immer auf die neueste Fassung - er bleibt also gueltig
          und laesst sich als Lesezeichen speichern.

          ### Hinweis zur Signatur

          Solange kein eigener Signaturschluessel hinterlegt ist, wird mit dem
          Debug-Schluessel signiert. Eine APK aus einer anderen Quelle (etwa
          Codemagic oder ein lokaler Build) hat dann eine andere Signatur und
          laesst sich nicht darueber installieren - in dem Fall vorher
          deinstallieren. Wie du einen eigenen Schluessel einrichtest, steht in
          [docs/veroeffentlichen.md](https://github.com/DrJakeberg/qrcard/blob/main/docs/veroeffentlichen.md).

          ### iOS

          Eine installierbare .ipa kann hier nicht entstehen - dafuer braucht es
          ein Apple-Zertifikat. Der iOS-Build wird nur auf Fehlerfreiheit
          geprueft.
          NOTES

          # Bei einem erneuten Lauf desselben Tags gibt es das Release schon -
          # dann nur die Datei ersetzen, statt am Anlegen zu scheitern.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits - ersetze nur die APK."
            gh release upload "$TAG" visitenkarte.apk --clobber
          else
            gh release create "$TAG" visitenkarte.apk \
              --title "Visitenkarte $TAG" \
              --notes-file notes.md
          fi
